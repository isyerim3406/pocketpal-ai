
name: Build PocketPal IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios

      - name: Create temporary Firebase config
        run: |
          cat > ios/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>LOCAL_BUILD_NO_FIREBASE</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>ai.pocketpal</string>
            <key>PROJECT_ID</key>
            <string>pocketpal-local-build</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          PLIST

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="$GITHUB_WORKSPACE/build/derived/Build/Products/Release-iphoneos/PocketPal.app"
          test -d "$APP"
          mkdir -p "$GITHUB_WORKSPACE/package/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/package/Payload/"
          cd "$GITHUB_WORKSPACE/package"
          zip -qry "$GITHUB_WORKSPACE/PocketPal-unsigned.ipa" Payload
          test -f "$GITHUB_WORKSPACE/PocketPal-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: PocketPal-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
